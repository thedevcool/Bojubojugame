# fly launch --no-deploy --copy-config  (then set secrets, see DEPLOY.md)
app = "boju-boju-api"
primary_region = "jnb"

[build]

[env]
  ENV = "prod"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Live rooms are in-process: never sleep, exactly one machine for v1.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
